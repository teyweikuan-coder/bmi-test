<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1a1a1a;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2rem 2.25rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 1.5rem;
    }

    .unit-toggle {
      display: flex;
      background: #f0efea;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.5rem;
      width: fit-content;
    }

    .unit-btn {
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: 6px 22px;
      font-size: 14px;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      transition: all 0.18s;
    }

    .unit-btn.active {
      background: #fff;
      color: #1a1a1a;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 1.5rem;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 13px; color: #666; font-weight: 500; }

    .input-group input {
      border: 1.5px solid #e8e7e2;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      color: #1a1a1a;
      background: #fafaf8;
      width: 100%;
      transition: border-color 0.15s;
      outline: none;
    }

    .input-group input:focus { border-color: #4a7cdc; background: #fff; }

    .ft-in { display: flex; gap: 8px; }
    .ft-in input { width: 50%; }

    .result-card {
      background: #f7f6f2;
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }

    .bmi-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 1rem; }

    .bmi-number {
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
      color: #ccc;
      transition: color 0.3s;
    }

    .bmi-category {
      font-size: 17px;
      font-weight: 500;
      color: #aaa;
      transition: color 0.3s;
    }

    .gauge-wrap { margin-bottom: 6px; }

    .gauge-track {
      height: 10px;
      border-radius: 99px;
      background: linear-gradient(to right, #378ADD 0%, #639922 22%, #EF9F27 40%, #E24B4A 65%, #A32D2D 100%);
      position: relative;
    }

    .gauge-pointer {
      position: absolute;
      top: -5px;
      width: 20px;
      height: 20px;
      background: #fff;
      border: 2.5px solid #1a1a1a;
      border-radius: 50%;
      transform: translateX(-50%);
      transition: left 0.4s cubic-bezier(.4,0,.2,1), opacity 0.3s;
      opacity: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }

    .gauge-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: #aaa;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .cat-item {
      background: #fafaf8;
      border: 1.5px solid #e8e7e2;
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
      transition: border-color 0.25s, background 0.25s;
    }

    .cat-item.active {
      background: #fff;
    }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 4px;
    }

    .cat-name { font-size: 11px; color: #555; font-weight: 500; display: block; }
    .cat-range { font-size: 10px; color: #aaa; display: block; margin-top: 2px; }

    footer {
      text-align: center;
      font-size: 12px;
      color: #bbb;
      margin-top: 1.25rem;
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem 1.25rem; }
      .categories { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Body Mass Index — WHO classification</p>

    <div class="unit-toggle">
      <button class="unit-btn active" id="btn-metric" onclick="setUnit('metric')">Metric</button>
      <button class="unit-btn" id="btn-imperial" onclick="setUnit('imperial')">Imperial</button>
    </div>

    <div class="input-row">
      <div class="input-group" id="grp-metric">
        <label>Height (cm)</label>
        <input type="number" id="height-cm" placeholder="170" min="50" max="250" oninput="calc()" />
      </div>
      <div class="input-group" id="grp-imperial" style="display:none;">
        <label>Height (ft &amp; in)</label>
        <div class="ft-in">
          <input type="number" id="height-ft" placeholder="ft" min="1" max="8" oninput="calc()" />
          <input type="number" id="height-in" placeholder="in" min="0" max="11" oninput="calc()" />
        </div>
      </div>
      <div class="input-group">
        <label id="weight-label">Weight (kg)</label>
        <input type="number" id="weight" placeholder="70" min="1" max="500" oninput="calc()" />
      </div>
    </div>

    <div class="result-card">
      <div class="bmi-row">
        <span class="bmi-number" id="bmi-val">—</span>
        <span class="bmi-category" id="bmi-cat">Enter your details</span>
      </div>
      <div class="gauge-wrap">
        <div class="gauge-track">
          <div class="gauge-pointer" id="ptr"></div>
        </div>
        <div class="gauge-labels">
          <span>16</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
        </div>
      </div>
    </div>

    <div class="categories">
      <div class="cat-item" id="cat-under">
        <span class="cat-dot" style="background:#378ADD;"></span>
        <span class="cat-name">Under-weight</span>
        <span class="cat-range">&lt; 18.5</span>
      </div>
      <div class="cat-item" id="cat-normal">
        <span class="cat-dot" style="background:#639922;"></span>
        <span class="cat-name">Normal</span>
        <span class="cat-range">18.5–24.9</span>
      </div>
      <div class="cat-item" id="cat-over">
        <span class="cat-dot" style="background:#EF9F27;"></span>
        <span class="cat-name">Over-weight</span>
        <span class="cat-range">25–29.9</span>
      </div>
      <div class="cat-item" id="cat-ob1">
        <span class="cat-dot" style="background:#E24B4A;"></span>
        <span class="cat-name">Obese I</span>
        <span class="cat-range">30–34.9</span>
      </div>
      <div class="cat-item" id="cat-ob2">
        <span class="cat-dot" style="background:#A32D2D;"></span>
        <span class="cat-name">Obese II+</span>
        <span class="cat-range">&ge; 35</span>
      </div>
    </div>

    <footer>BMI is a screening tool, not a medical diagnosis.</footer>
  </div>

  <script>
    let unit = 'metric';

    function setUnit(u) {
      unit = u;
      document.getElementById('btn-metric').className = 'unit-btn' + (u === 'metric' ? ' active' : '');
      document.getElementById('btn-imperial').className = 'unit-btn' + (u === 'imperial' ? ' active' : '');
      document.getElementById('grp-metric').style.display = u === 'metric' ? '' : 'none';
      document.getElementById('grp-imperial').style.display = u === 'imperial' ? '' : 'none';
      document.getElementById('weight-label').textContent = u === 'metric' ? 'Weight (kg)' : 'Weight (lbs)';
      calc();
    }

    function calc() {
      let h, w;
      if (unit === 'metric') {
        h = parseFloat(document.getElementById('height-cm').value) / 100;
        w = parseFloat(document.getElementById('weight').value);
      } else {
        const ft = parseFloat(document.getElementById('height-ft').value) || 0;
        const inch = parseFloat(document.getElementById('height-in').value) || 0;
        h = (ft * 12 + inch) * 0.0254;
        w = parseFloat(document.getElementById('weight').value) * 0.453592;
      }

      const ptr = document.getElementById('ptr');
      const valEl = document.getElementById('bmi-val');
      const catEl = document.getElementById('bmi-cat');
      const cats = ['cat-under','cat-normal','cat-over','cat-ob1','cat-ob2'];

      if (!h || !w || h <= 0 || w <= 0) {
        valEl.textContent = '—';
        valEl.style.color = '#ccc';
        catEl.textContent = 'Enter your details';
        catEl.style.color = '#aaa';
        ptr.style.opacity = '0';
        cats.forEach(id => {
          document.getElementById(id).style.borderColor = '';
          document.getElementById(id).classList.remove('active');
        });
        return;
      }

      const bmi = w / (h * h);
      const rounded = bmi.toFixed(1);

      let label, color, catId, pct;
      if (bmi < 18.5) {
        label = 'Underweight'; color = '#378ADD'; catId = 'cat-under';
        pct = Math.max(2, ((bmi - 16) / 2.5) * 22);
      } else if (bmi < 25) {
        label = 'Normal weight'; color = '#639922'; catId = 'cat-normal';
        pct = 22 + ((bmi - 18.5) / 6.5) * 18;
      } else if (bmi < 30) {
        label = 'Overweight'; color = '#EF9F27'; catId = 'cat-over';
        pct = 40 + ((bmi - 25) / 5) * 25;
      } else if (bmi < 35) {
        label = 'Obese (class I)'; color = '#E24B4A'; catId = 'cat-ob1';
        pct = 65 + ((bmi - 30) / 5) * 17;
      } else {
        label = 'Obese (class II+)'; color = '#A32D2D'; catId = 'cat-ob2';
        pct = Math.min(97, 82 + ((bmi - 35) / 5) * 15);
      }

      valEl.textContent = rounded;
      valEl.style.color = color;
      catEl.textContent = label;
      catEl.style.color = color;

      ptr.style.left = pct + '%';
      ptr.style.opacity = '1';
      ptr.style.borderColor = color;

      cats.forEach(id => {
        const el = document.getElementById(id);
        if (id === catId) {
          el.style.borderColor = color;
          el.classList.add('active');
        } else {
          el.style.borderColor = '';
          el.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>
